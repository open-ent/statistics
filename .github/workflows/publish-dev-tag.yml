name: Publish Dev Tag

# Force la republication du build courant vers rct-nexus (+ GitHub Packages),
# sans passer par un nouveau tag de release. build-and-publish.yml ne publie que
# sur un push de tag (`refs/tags/*`) : pour un fork "-patched", la version du
# pom NE CHANGE PAS entre deux itérations sur la même branche `<version>-dev`
# (cf. la convention "ne jamais inventer de version" des forks) — il n'y a donc
# jamais de nouveau tag à pousser, seulement de nouveaux commits sur la branche
# `-patched-dev` déjà taguée.
#
# Ce workflow republie sous l'IDENTIFIANT DE VERSION INCHANGÉ du pom (ex.
# 2.6.0-patched) : il déplace le tag existant sur le dernier commit de la
# branche depuis laquelle il est déclenché, puis rebuild + republie le fat jar
# sous ce même identifiant (écrase l'artefact précédent sur rct-nexus/GitHub
# Packages). Se déclenche manuellement (workflow_dispatch), depuis la branche
# `-patched-dev` à republier.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-dev-tag:
    name: Tag & Publish Dev Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que la branche déclenchante est bien un fork -patched-dev
        run: |
          case "${{ github.ref }}" in
            refs/heads/*-patched-dev) ;;
            *)
              echo "::error::Ce workflow doit être déclenché depuis une branche *-patched-dev (reçu: ${{ github.ref }})"
              exit 1
              ;;
          esac

      # [A] IHM AngularJS historique (gulp, Node 10) — cf. build-and-publish.yml.
      - name: Build frontend historique avec Node 10 via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      # [B] IHM React (vue *-react.html) : sous-projet Vite frontend/ (Node 20).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build frontend React (sous-projet Vite frontend/)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          cd frontend
          node scripts/refresh-open-ent-lock.mjs
          pnpm install --no-frozen-lockfile
          pnpm build
          mkdir -p ../src/main/resources/public
          cp -r dist/public/. ../src/main/resources/public/

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Lire la version du pom (inchangée, cf. convention forks)
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version republiée (inchangée): ${VERSION}"

      - name: Créer/déplacer le tag ${{ steps.version.outputs.version }}
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "Republication forcée depuis ${GITHUB_REF_NAME}@${GITHUB_SHA::8}"
          git push origin "refs/tags/$TAG"

      - name: Build fat JAR
        run: mvn clean package -Dmaven.test.skip=true -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}

      - name: Publish fat JAR to rct-nexus
        continue-on-error: true
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          FAT_ABS=$(realpath "${FAT_JAR}")
          BASE=$(basename "${FAT_JAR}" -fat.jar)
          GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
          echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus (maven-releases)"
          cd /tmp
          mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B

      - name: Publish fat JAR to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          FAT_ABS=$(realpath "${FAT_JAR}")
          BASE=$(basename "${FAT_JAR}" -fat.jar)
          GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
          cd /tmp
          mvn deploy:deploy-file -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=github -Durl="https://maven.pkg.github.com/${{ github.repository }}" -B

      - name: Nettoyer les anciennes GitHub Releases pour ce tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "Suppression de la release existante $id pour le tag $TAG"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done

      - name: Créer/mettre à jour la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          files: target/*-fat.jar
