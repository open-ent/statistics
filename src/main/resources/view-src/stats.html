<!DOCTYPE html>
<html>

	<head>
		<title>{{#i18n}}stats.title{{/i18n}}</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<script src="/assets/js/entcore/ng-app.js?v=@@VERSION" type="text/javascript" id="context"></script>
		<script src="/stats/public/dist/application.js?v=@@VERSION" type="text/javascript"></script>

		<script src="/stats/public/js/chartjs/2.9.3/Chart.bundle.min.js" type="text/javascript"></script>
		<script type="text/ng-template" id="empty"></script>
	</head>

	<body ng-controller="StatsController">
		<portal>
			<div class="twelve cell" ng-include="template.containers.main"></div>
		</portal>
		<section class="lightbox-backdrop"></section>
		<section class="lightbox-window five cell">
			<div class="twelve cell" ng-include="template.containers.lightbox"></div>
			<div class="close-lightbox">
				<i class="close-2x"></i>
			</div>
			<div class="clear"></div>
		</section>
		<!-- Bascule permanente ancienne / nouvelle interface (ui-fab.js générique, identique dans chaque module à double interface). -->
	<script type="text/javascript" src="/stats/public/ui-fab.js?v=@@VERSION"></script>
</body>

</html>
